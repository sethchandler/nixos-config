# =============================================================================
#  MY HYPRLAND CONFIGURATION
#  Based on CachyOS defaults + User Modifications
# =============================================================================

# --- Monitors ---
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1

# --- Programs ---
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun
$browser = firefox
$shiftbrowser = librewolf
$smarttexteditor = kate
$simpletexteditor = kwrite
$office = libreoffice

# --- Autostart ---
# Execute your favorite apps at launch
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = nm-applet --indicator
# This ensures clipboard works across apps
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Environment Variables ---
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct   # Essential for Dolphin theming
env = QT_QPA_PLATFORM,wayland      # Forces Dolphin to use Wayland
env = EDITOR,nano

# --- Input ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# --- General ---
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 6
    col.active_border = rgba(33ccfaa) rgba(00ff99aa) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

# --- Decoration ---
decoration {
    active_opacity = 1.0
    inactive_opacity=0.8
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# --- Animations ---
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- Layouts ---
dwindle {
    pseudotile = yes
    preserve_split = yes
}

# =============================================================================
#  KEYBINDINGS
# =============================================================================
$mainMod = SUPER

# -- CachyOS Standard Bindings --
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exec, loginctl terminate-user $USER
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, Space, exec, $menu
bind = $mainMod, Tab, exec, rofi -show window
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen
bind = $mainMod, B, exec, $browser
#bind = $mainMod SHIFT, B, exec $shiftbrowser
#bind = $mainMod CONTROL, B, exec, $controlbrowser
bind = $mainMod, K, exec, $smarttexteditor
bind = $mainMod SHIFT, K, exec, $simpletexteditor
bind = $mainMod, T, exec, $terminal
bind = $mainMod SHIFT,W,exec,/home/seth/.config/hypr/change_wallpaper.sh
#bind = $mainMod, O, exec, $office

# -- Window Navigation (Vim style) --
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# -- Workspace Navigation --
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# -- Move Window to Workspace --
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# -- Mouse Resize --
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# =============================================================================
#  CUSTOM MODIFICATIONS
# =============================================================================

# Screenshot (SUPER + Backslash)
bind = $mainMod, backslash, exec, flameshot gui
# Uses 'grim' to screenshot and 'slurp' to let you select the area
# bind = $mainMod, backslash, exec, grim -g "$(slurp)" - | wl-copy

# If you prefer it to save to a file instead of clipboard:
# bind = $mainMod, backslash, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png
